<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>AUTHENTICATION</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<main class="page">
  <section class="panel" aria-label="Authentication">
    <div class="mark">AUTHENTICATION</div>
    <h1>AUTHENTICATION</h1>
    <p class="prompt">enter your id and password</p>

    <form id="loginForm" autocomplete="off" novalidate>
      <label for="userId">ID</label>
      <input id="userId" type="text" placeholder="Enter your ID" required>

      <label for="userPassword">PASSWORD</label>
      <input id="userPassword" type="password" placeholder="Enter your password" required>

      <div class="button-zone" id="buttonZone">
        <button id="loginButton" type="submit">LOGIN</button>
      </div>

      <p class="status" id="status">Fill in both fields to begin.</p>
    </form>

    <div class="note">FRONT-END DEMO · NO CREDENTIALS ARE STORED OR SENT</div>
  </section>
</main>

<div class="celebration" id="celebration" hidden aria-live="polite">
  <div class="celebration-burst" id="celebrationBurst"></div>
  <div class="success-card">
    <div class="success-check">✓</div>
    <h2>you are successfully logined<br>to this website with more patience</h2>
    <p id="successDetail">Patience level: impressive.</p>
    <button class="again" id="againButton" type="button">Wanna try again?</button>
    <div class="review" id="reviewBox" hidden>
      <strong>How was the website?</strong>
      <p>Your review:</p>
      <textarea id="reviewText" maxlength="300" placeholder="Tell us what you think..."></textarea>
      <button class="submit-review" id="submitReview" type="button">SUBMIT REVIEW</button>
      <p class="review-message" id="reviewMessage"></p>
    </div>
  </div>
</div>

<script src="app.js?v=20261008b"></script>
</body>
</html>
